name: Deploy Web (PWA) to GitHub Pages

on:
  push:
    branches: ["pwa-support"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOJURE_VERSION: "1.12.4.1618"
  NODE_VERSION: "24"
  JAVA_VERSION: "21"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Set build environment flags
        run: |
          echo "ENABLE_FILE_SYNC_PRODUCTION=true" >> $GITHUB_ENV
          echo "ENABLE_RTC_SYNC_PRODUCTION=true" >> $GITHUB_ENV

      - name: Build web + workers
        run: |
          pnpm gulp:build
          clojure -M:cljs release app db-worker \
            --config-merge '{:compiler-options {:source-map true :source-map-include-sources-content true :source-map-detail-level :symbols}}'
          pnpm webpack-app-build
          rsync -avz \
            --exclude node_modules \
            --exclude android \
            --exclude ios \
            --exclude mobile \
            --exclude js \
            --exclude css \
            --exclude img \
            --exclude fonts \
            --exclude static \
            ./static/ ./public/
          rm -f ./public/js/*.map
        env:
          LOGSEQ_POSTHOG_TOKEN: ${{ secrets.LOGSEQ_POSTHOG_TOKEN }}

      - name: Inject PWA tags into built index.html
        run: node scripts/inject-pwa.js

      - name: Add SPA fallback (404.html → shell)
        run: cp ./public/index.html ./public/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: ""
